# Линтер для учебного кода. Ruff подключён в VS Code как линтер (не форматтер) —
# PEP8-замечания ученик правит руками, автоформат их бы молча прятал.
#
# Добавлено 2026-08-27: к набору по умолчанию включены три правила, которые
# до этого приходилось ловить глазами на каждом ревью.
line-length = 88   # совпадает с линейкой editor.rulers в настройках редактора

[lint]
extend-select = [
    "W291",  # пробелы в конце строки
    "W293",  # пустая строка с пробелами
    "E501",  # строка длиннее line-length
]

# W292 (нет перевода строки в конце файла) намеренно НЕ включено:
# 65 срабатываний на текущей практике — стена красного вместо обучения.
